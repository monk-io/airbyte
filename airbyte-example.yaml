namespace: airbyte

example-db:
  defines: runnable
  inherits: postgresql/db
  metadata:
    name: Airbyte Example PostgreSQL
    description: Private PostgreSQL database used by the Airbyte component example.
    tags: airbyte, postgres, database, example, local
    website: https://www.postgresql.org/
    source: https://github.com/postgres/postgres
    publisher: monk.io
    icon: https://www.postgresql.org/media/img/about/press/elephant.png
    private: false
  variables:
    version:
      type: string
      value: "17"
      description: Public PostgreSQL Docker image tag used by the component example.
    db_name:
      type: string
      env: POSTGRES_DB
      value: <- $example-db-name
      description: PostgreSQL database name created for Airbyte.
    db_user:
      type: string
      env: POSTGRES_USER
      value: <- $example-db-user
      description: PostgreSQL user created for Airbyte.
    db_pass:
      type: string
      env: POSTGRES_PASSWORD
      value: <- $example-db-password
      description: Sensitive generated PostgreSQL password for the component example.
  containers:
    postgres:
      mounted-volumes:
        postgres-data:
          path: /var/lib/postgresql/data
  volumes:
    postgres-data:
      kind: local
  services:
    postgres:
      container: postgres
      port: 5432
      protocol: tcp
      publish: false
      description: Private PostgreSQL endpoint consumed by Airbyte.
  checks:
    readiness:
      code: tcp-check-service("airbyte/example-db", "postgres")
      period: 10
      initialDelay: 10
      attempts: 30

example-minio:
  defines: runnable
  inherits: minio/minio-server
  metadata:
    name: Airbyte Example MinIO
    description: Private S3-compatible object store used by the Airbyte component example.
    tags: airbyte, minio, object-storage, example, local
    website: https://min.io/
    source: https://github.com/minio/minio
    publisher: monk.io
    icon: https://min.io/resources/img/logo.svg
    private: false
  variables:
    admin-username:
      type: string
      env: MINIO_ROOT_USER
      value: <- $example-s3-access-key
      description: Sensitive generated MinIO root access key for the component example.
    admin-password:
      type: string
      env: MINIO_ROOT_PASSWORD
      value: <- $example-s3-secret-key
      description: Sensitive generated MinIO root secret key for the component example.
    api-port:
      type: int
      value: 9000
      description: MinIO S3 API port.
    console-port:
      type: int
      env: MINIO_CONSOLE_PORT
      value: 9001
      description: MinIO console port, kept private in the component example.
  containers:
    minio:
      mounted-volumes:
        minio-data:
          path: /data
  volumes:
    minio-data:
      kind: local
  services:
    api:
      container: minio
      port: <- $api-port
      protocol: tcp
      publish: false
      description: Private S3-compatible API endpoint consumed by Airbyte.
    console:
      container: minio
      port: <- $console-port
      protocol: tcp
      publish: false
      description: Private MinIO console service for local inspection when explicitly exposed by inheriting templates.
  checks:
    readiness:
      code: tcp-check-service("airbyte/example-minio", "api")
      period: 10
      initialDelay: 10
      attempts: 30

example-init:
  defines: runnable
  inherits: airbyte/init
  metadata:
    name: Airbyte Example Init
    description: Creates Airbyte local workspace directories for the component example.
    tags: airbyte, init, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false

example-temporal:
  defines: runnable
  inherits: airbyte/temporal
  metadata:
    name: Airbyte Example Temporal
    description: Temporal service wired to the component example PostgreSQL database.
    tags: airbyte, temporal, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false
  variables:
    database-host:
      type: string
      value: <- connection-hostname("db")
      description: PostgreSQL hostname from the component example db connection.
    database-port:
      type: int
      value: <- connection-port("db")
      description: PostgreSQL port from the component example db connection.
    database-name:
      type: string
      value: <- $example-db-name
      description: PostgreSQL database name used by Airbyte Temporal.
    database-user:
      type: string
      env: DATABASE_USER
      value: <- $example-db-user
      description: PostgreSQL user used by Airbyte Temporal.
    database-password:
      type: string
      env: DATABASE_PASSWORD
      value: <- $example-db-password
      description: Sensitive generated PostgreSQL password used by Airbyte Temporal.
  connections:
    db:
      target: airbyte/example-db
      service: postgres
      description: Private PostgreSQL service connection.
  depends:
    wait-for:
      runnables:
        - airbyte/example-db
      timeout: 180
  checks:
    readiness:
      code: tcp-check-service("airbyte/example-temporal", "temporal")
      period: 15
      initialDelay: 45
      attempts: 40

example-bootloader:
  defines: runnable
  inherits: airbyte/bootloader
  metadata:
    name: Airbyte Example Bootloader
    description: Runs Airbyte migrations for the component example.
    tags: airbyte, bootloader, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false
  variables:
    database-host:
      type: string
      value: <- connection-hostname("db")
      description: PostgreSQL hostname from the component example db connection.
    database-port:
      type: int
      value: <- connection-port("db")
      description: PostgreSQL port from the component example db connection.
    database-name:
      type: string
      value: <- $example-db-name
      description: PostgreSQL database name used by Airbyte bootloader.
    database-user:
      type: string
      env: DATABASE_USER
      value: <- $example-db-user
      description: PostgreSQL user used by Airbyte bootloader.
    database-password:
      type: string
      env: DATABASE_PASSWORD
      value: <- $example-db-password
      description: Sensitive generated PostgreSQL password used by Airbyte bootloader.
  connections:
    db:
      target: airbyte/example-db
      service: postgres
      description: Private PostgreSQL service connection.
  depends:
    wait-for:
      runnables:
        - airbyte/example-db
      timeout: 180

example-server:
  defines: runnable
  inherits: airbyte/server
  metadata:
    name: Airbyte Example Server
    description: Airbyte API server for the component example.
    tags: airbyte, api, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false
  variables:
    database-host:
      type: string
      value: <- connection-hostname("db")
      description: PostgreSQL hostname from the component example db connection.
    database-port:
      type: int
      value: <- connection-port("db")
      description: PostgreSQL port from the component example db connection.
    database-name:
      type: string
      value: <- $example-db-name
      description: PostgreSQL database name used by Airbyte server.
    database-user:
      type: string
      env: DATABASE_USER
      value: <- $example-db-user
      description: PostgreSQL user used by Airbyte server.
    database-password:
      type: string
      env: DATABASE_PASSWORD
      value: <- $example-db-password
      description: Sensitive generated PostgreSQL password used by Airbyte server.
    temporal-host:
      type: string
      env: TEMPORAL_HOST
      value: <- connection-hostname("temporal") set-tmp("host") connection-port("temporal") set-tmp("port") `${host}:${port}`
      description: Temporal host and port from the component example temporal connection.
    internal-api-host:
      type: string
      env: INTERNAL_API_HOST
      value: localhost:8001
      description: Internal API host used by the server itself.
    storage-endpoint:
      type: string
      env: S3_ENDPOINT
      value: <- connection-hostname("object-storage") set-tmp("host") connection-port("object-storage") set-tmp("port") `http://${host}:${port}`
      description: MinIO S3 endpoint from the component example object-storage connection.
    storage-access-key-id:
      type: string
      env: S3_ACCESS_KEY_ID
      value: <- $example-s3-access-key
      description: Sensitive generated S3 access key for the component example.
    storage-secret-access-key:
      type: string
      env: S3_SECRET_ACCESS_KEY
      value: <- $example-s3-secret-key
      description: Sensitive generated S3 secret key for the component example.
  connections:
    db:
      target: airbyte/example-db
      service: postgres
      description: Private PostgreSQL service connection.
    temporal:
      target: airbyte/example-temporal
      service: temporal
      description: Private Temporal service connection.
    object-storage:
      target: airbyte/example-minio
      service: api
      description: Private S3-compatible object storage connection.
  depends:
    wait-for:
      runnables:
        - airbyte/example-temporal
        - airbyte/example-minio
        - airbyte/example-db
      timeout: 300

