example-webapp:
  defines: runnable
  inherits: airbyte/webapp
  metadata:
    name: Airbyte Example Webapp
    description: Published local Airbyte web UI for the component example.
    tags: airbyte, webapp, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false
  variables:
    webapp-url:
      type: string
      env: WEBAPP_URL
      value: http://localhost:18000/
      description: Local URL for the component example web UI.
    internal-api-host:
      type: string
      env: INTERNAL_API_HOST
      value: <- connection-hostname("api") set-tmp("host") connection-port("api") set-tmp("port") `${host}:${port}`
      description: Airbyte internal API host and port from the component example server connection.
    host-port:
      type: int
      value: 18000
      description: Non-privileged host port published for local component example verification.
  services:
    http:
      container: webapp
      port: 80
      protocol: tcp
      publish: true
      host-port: <- $host-port
      description: Published local Airbyte web UI endpoint for external smoke testing.
  connections:
    api:
      target: airbyte/example-server
      service: api
      description: Private Airbyte API service connection.
  depends:
    wait-for:
      runnables:
        - airbyte/example-server
      timeout: 300
  checks:
    readiness:
      code: http-get-service("airbyte/example-webapp", "http", "/") get-member("status") 200
      period: 15
      initialDelay: 60
      attempts: 40

example:
  defines: process-group
  metadata:
    name: Airbyte Component Example
    description: |
      Component demonstration that inherits the reusable Airbyte runnables and
      wires concrete catalog PostgreSQL and MinIO backing services. The web UI is
      published on localhost for verification only.
    tags: airbyte, elt, postgres, minio, component, example, local
    website: https://airbyte.com/
    source: https://github.com/airbytehq/airbyte
    publisher: monk.io
    icon: https://assets-global.website-files.com/6064b31ff49a2d31e0493af1/62fe7dbb7344b272e290f1c7_airbytelogo.png
    private: false
  variables:
    example-db-name:
      type: string
      value: airbyte
      description: PostgreSQL database name created for the component example.
    example-db-user:
      type: string
      value: airbyte
      description: PostgreSQL user created for the component example.
    example-db-password:
      type: string
      value: <- random-uuid
      description: Sensitive generated PostgreSQL password for the component example.
    example-s3-access-key:
      type: string
      value: airbyte
      description: Sensitive generated MinIO access key for the component example.
    example-s3-secret-key:
      type: string
      value: <- random-uuid
      description: Sensitive generated MinIO secret key for the component example.
  runnable-list:
    - airbyte/example-db
    - airbyte/example-minio
    - airbyte/example-temporal
    - airbyte/example-server
    - airbyte/example-worker
    - airbyte/example-cron
    - airbyte/example-webapp
